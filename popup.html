<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="w-80 p-4 bg-gray-50">
  <div class="bg-white rounded-lg shadow-md p-6">
    <h1 class="text-xl font-bold text-gray-900 mb-4">Good Replies</h1>
    
    <!-- Login Form (hidden when logged in) -->
    <div id="loginForm" class="space-y-4">
      <p class="text-sm text-gray-600 mb-4">Please login to continue</p>
      
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input type="email" id="email" placeholder="Enter your email" 
               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
      </div>
      
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password" id="password" placeholder="Enter your password"
               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
      </div>
      
      <button id="loginBtn" 
              class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-md transition duration-200 disabled:opacity-50 disabled:cursor-not-allowed">
        <span id="loginBtnText">Login</span>
        <div id="loginSpinner" class="hidden w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin ml-2"></div>
      </button>
    </div>
    
    <!-- Main Content (hidden when logged out) -->
    <div id="mainContent" class="hidden space-y-4">
      <p class="text-sm text-gray-600">Parse comments from the current page into JSON format.</p>
      <button id="actionBtn" 
              class="w-full bg-green-600 hover:bg-green-700 text-white font-medium py-2 px-4 rounded-md transition duration-200">
        Parse Comments
      </button>
      <button id="logoutBtn" 
              class="w-full bg-gray-600 hover:bg-gray-700 text-white font-medium py-2 px-4 rounded-md transition duration-200 text-sm">
        Logout
      </button>
    </div>
    
    <!-- Status Messages -->
    <div id="status" class="hidden mt-4 p-3 rounded-md text-sm"></div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
